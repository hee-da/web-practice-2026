<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한서희 이력서</title>
</head>
<body>
    <!-- 1. 제목 태그 -->
     <h1>한서희 이력서</h1>
    
    <!-- 2. 텍스트 태그 -->
     <p>안녕하세요. 제주대학교 컴퓨터공학과 한서희입니다.</p>
     <p>열심히 하겠습니다. 감사합니다.</p>
    
    <!-- 3. 목록 태그 -->
     <h2>배우고 싶은 기술 스택</h2>
     <ul>
        <li>1. Linux</li>
        <li>2. 클라우드 컴퓨팅</li>
        <li>3. DB</li>
     </ul>
    
    <!-- 4. 표 태그 -->
     <h2>학력 및 경력</h2>
     <table border="1">
        <caption></caption>
        <tr>
            <th scope="row">학력</th>
            <td>제주대학교 컴퓨터공학과</td>
        </tr>
        <tr>
            <th scope="row">경력</th>
            <td>없음</td>
        </tr>
     </table>
</body>
</html>
