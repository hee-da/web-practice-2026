<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기</title>
    <meta name="description" content="기초웹개발론 3주차 실습 [문의하기 페이지]">
    <meta property="og:title" content="한서희 | 문의하기 페이지">
    <meta property="og:description" content="기초웹개발론 3주차 실습 [문의하기 페이지]">
    <meta property="og:url" content="https://hee-da.github.io/week3/">

</head>
<body>
    <header>
        <h1>문의하기</h1>
    </header>

    <main>
        <img src="cat.jpg" alt="초근접 고양이 얼굴 사진" width="200">
        
        <form action="/submit" method="post">
            <div>
                <label for="name">이름</label>
                <input type="text" id="name" name="name" required placeholder="이름을 입력해주세요" autofocus>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required placeholder="이메일을 입력해주세요">
            </div>

            <div>
                <label for="type">문의 유형</label>
                <select id="type" name="type">
                    <option value="a">질문</option>
                    <option value="b">제안</option>
                </select>
            </div>
            <div>
                <label for="message">문의 내용</label>
                <textarea id="message" name="message" rows="5" required placeholder="문의 내용을 입력해주세요"></textarea>
            </div>

            <div>
                <button type="submit">보내기</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2025208019 한서희</p>
        <a href="mailto:shee1120@stu.jejunu.ac.kr">이메일 보내기</a>
    </footer>
</body>
</html>
